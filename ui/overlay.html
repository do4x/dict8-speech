<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dict8 overlay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
    <script>
      // The browser (npm run dev / Playwright) has no desktop behind the page.
      if (!window.webkit?.messageHandlers?.dict8) document.body.classList.add("dev");
    </script>
  </body>
</html>
