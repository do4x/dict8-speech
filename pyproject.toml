[project]
name = "dict8"
version = "0.1.0"
description = "Push-to-talk dictation in front of Claude Code, with a usage layer underneath."
requires-python = ">=3.11"
# The headless layer — usage, quota, estimate, the UserPromptSubmit hook — needs nothing
# but a YAML reader. Everything heavier is an extra, so `uv run dict8 usage` (and the hook
# that runs on every prompt in this repo) syncs 2 packages, not 35.
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# `classifier.backend: mlx-lm`. Apple Silicon only by construction (CLAUDE.md invariant 7:
# there is no CUDA on this machine and no non-Apple target), and optional since 2026-09-19
# (U4) because nothing in the headless layer imports it. Install with
# `uv run --extra classify …` or `uv sync --extra classify`; without it
# `dict8.advise.classifier` fails open with one log line (invariant 2).
classify = [
    "mlx-lm>=0.28 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# `dict8 app` and `dict8 dictate` (U5, 2026-09-19): the menu-bar shell (ADR-001: PyObjC in
# one process), audio capture, local STT (`stt.backend: mlx-whisper`) and injection. Kept
# out of the base install for the same reason as `classify`: the UserPromptSubmit hook runs
# `uv run dict8 hook ...` on every prompt and imports none of this. Run the app with
# `uv run --extra app dict8 app`.
app = [
    # U6: the app classifies each dictation on release for the model chip, so the app
    # extra carries the classifier's. Without it the chip is simply absent (invariant 2).
    "dict8[classify]",
    "pyobjc-framework-Cocoa>=11 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11 ; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=11 ; sys_platform == 'darwin'",
    "sounddevice>=0.5",
    "numpy>=2",
    "mlx-whisper>=0.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
# Synced by `uv run` by default, never shipped. The gates are integration checks against
# this machine's real transcripts; these are the hermetic unit tests underneath them.
dev = [
    "pytest>=8",
]

[project.scripts]
dict8 = "dict8.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dict8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# mlx-whisper 0.4.x declares torch only for its checkpoint converter
# (mlx_whisper/torch_whisper.py). The transcribe path Dict8 uses never imports it (grep'd
# 2026-09-19, U5), and it is 526 MB installed. A marker that can never match drops it.
override-dependencies = ["torch ; sys_platform == 'never'"]
