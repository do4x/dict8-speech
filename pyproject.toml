[project]
name = "dict8"
version = "0.1.0"
description = "Push-to-talk dictation in front of Claude Code, with a usage layer underneath."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
dict8 = "dict8.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dict8"]
