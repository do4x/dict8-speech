# config.yml — Dict8
# The ONLY source of truth for paths, keys, models, thresholds.
# RULE: null / "TBD" is never invented, never defaulted. Code reads config;
# code does not hardcode. A visible gap beats a plausible guess.

meta:
  app: "Dict8"
  version: "v1-mvp"
  platform: "macos"             # LOCKED — re-targeted from windows, see docs/ADR-000-platform.md
  arch: "apple-silicon"         # LOCKED — no CUDA path exists; see ADR-000
  target_tool: "claude-code"    # LOCKED — any other AI tool is out of scope

hardware:                       # all four: read off the real box, never assumed
  chip: "Apple M5"              # sysctl -n machdep.cpu.brand_string
  unified_memory_gb: 16         # bounds the largest model that can stay warm in memory
  macos_version: "26.6.2"       # sw_vers -productVersion (build 25G83)
  mic_device: "TBD"             # exact device name; an OUTPUT of the Phase 3 bench, never "default"

permissions:                    # TCC. All three are requested in onboarding and re-checked at launch.
  microphone: required
  accessibility: required       # CGEventPost (inject) AND CGEventTap (hotkey) — one grant covers both
  input_monitoring: required    # VERIFY in Phase 4 whether the tap trips this separate grant on
                                # this macOS version. Requested regardless: asking for a grant we
                                # turn out not to need is a small UX cost, missing one is a silent
                                # failure. Confirm and record, do not assume either way.
  recheck_on: "every_dictation" # grant is revocable at runtime; never cached as "granted once"
  note: "an unsigned binary loses its TCC grants when rebuilt — use a stable signing identity
         in dev or the permission dialogs reappear on every build"
  on_revoked: "toast with a deep link to the right Settings pane; never fail silently"
  poll_interval_s: 5            # provisional (2026-09-19): how often `dict8 app` re-preflights
                                # all three grants between dictations, so a grant revoked
                                # mid-session toasts instead of the tap going quietly deaf.
                                # Three preflight calls, no prompt; cost is negligible at any
                                # sane value. Every press re-checks regardless (recheck_on).
  ask_at_launch: true           # Denis, 2026-09-19: "add it so it asks for microphone permissions".
                                # `dict8 app` shows macOS's own dialog at launch for every grant
                                # not yet granted (macOS shows each dialog once; after that the
                                # window's Open Settings button is the fix). Also asked on the
                                # first press while the microphone is still unasked. Off: only
                                # the window's and the menu's buttons ask.
  settings_links:               # System Settings deep links, opened by menu › Check permissions
    microphone: "x-apple.systempreferences:com.apple.preference.security?Privacy_Microphone"
    accessibility: "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"
    input_monitoring: "x-apple.systempreferences:com.apple.preference.security?Privacy_ListenEvent"

packaging:
  bundle_id: "TBD"              # TCC grants attach to the signed bundle identity — must be stable
  signing: "TBD"                # ad-hoc vs Developer ID; re-signing can reset the Accessibility grant
  launch_at_login: "TBD"

hotkey:
  mechanism: "cgeventtap"       # provisional (2026-09-19): docs/ADR-002-hotkey.md — the only
                                # mechanism that can bind a bare modifier with a clean key-up.
                                # vs carbon_hotkey / RegisterEventHotKey (no permission, awkward
                                # for hold, CANNOT bind bare fn/right-opt).
  push_to_talk: "right_option"  # provisional (2026-09-19): docs/LOOP.md default — hold right
                                # Option. Types nothing on its own, so it collides with no
                                # terminal/IDE binding; fn/Globe is taken by macOS dictation and
                                # emoji. Names come from dict8/hotkey.py KEYS.
  push_to_talk_enhanced: "TBD"  # same, but forces enhance mode regardless of detect result
  cancel: "escape"              # provisional (2026-09-19): Esc while the talk key is held aborts
                                # without injecting. The Esc is swallowed so it cannot also
                                # interrupt a running Claude Code turn.

stt:
  backend: "mlx-whisper"        # provisional (2026-09-19): synthesized speech (macOS `say`), quick
                                # bench in bench/stt.md — only mlx-whisper was raced; the other
                                # two backends wait for Denis's real-speech run.
                                # NOT defaulted: CTranslate2 has no Metal backend, so the seeded
                                # "faster-whisper unless beaten" default pre-judged the benchmark
  model: "mlx-community/whisper-small.en-mlx"
                                # provisional (2026-09-19): synthesized speech, warm median
                                # 115 ms on a 3.0 s clip and 188 ms on 9.2 s (large-v3-turbo:
                                # 338 / 405 ms), both models word-identical on both clips.
                                # Cold load + warm-up 2.8 s, paid once at launch. HF repo id,
                                # resolved from the local cache (see dict8/stt).
  compute: "metal"              # provisional (2026-09-19): follows the backend — MLX runs on the
                                # GPU via Metal, and the quick bench measured with this value.
                                # metal | ane | cpu. Re-opens with the real-speech bench:
                                # faster-whisper-cpu runs on CPU, so the backend decides this.
  quantization: "fp16"          # provisional (2026-09-19): the mlx-community small.en weights
                                # carry no quantization block, so they load and run as fp16;
                                # measured with this value in the quick bench.
  language: "en"                # DECIDED: English-only for v1 MVP (Denis, 2026-09-14). Keeps all
                                # three candidates eligible and drops the language-detection pass
                                # from the hot path.
  vad: true                     # U5: an energy floor in front of STT (dict8.audio.is_silent,
                                # audio.silence_floor_dbfs), not a speech detector. A silent
                                # clip never reaches Whisper, which would invent words for it.
  keep_resident: true           # unified memory makes a warm model cheap; never reload per dictation
  candidates:                   # the Phase 3 benchmark matrix; bench reads this, nothing hardcoded
    backends: ["mlx-whisper", "whispercpp-metal", "faster-whisper-cpu"]
    models: ["small.en", "medium.en", "large-v3-turbo"]
                                # RESOLVED: language is "en", so the English-only models stay
                                # eligible and all three candidates race. Adding a non-English
                                # language later disqualifies small.en/medium.en — see ADR-000.

audio:
  min_hold_ms: 300              # SOURCE: prompts/build.md <phase_4_dictation_loop>, "release with
                                # <300 ms of audio (discard silently)" — a spec value, not chosen
                                # here. A tap of the talk key, not a dictation.
  max_hold_s: 120               # provisional (2026-09-19): a hold longer than this ends itself and
                                # is processed. Guards a lost key-up (tap disabled mid-hold) that
                                # would otherwise leave the mic open. 2 min is far past any prompt
                                # Denis dictates; long enough never to cut a real one short.
  frame_ms: 30                  # analysis window for the silence floor below: the loudest 30 ms
                                # frame's RMS is what is compared. Short enough that one spoken
                                # syllable fills a frame, long enough to average out a click.
  silence_floor_dbfs: -50       # provisional (2026-09-19): if no 30 ms frame's RMS reaches this,
                                # the clip is silence — no STT, nothing typed, a "heard nothing"
                                # toast. Speech sits around -30 to -20 dBFS RMS (bench/
                                # stt_bench.py's quality check); a muted mic or the first-use
                                # permission prompt yields digital zeros (-200). Room tone on a
                                # built-in mic is quieter than -50 in a quiet room; unmeasured on
                                # this mic (that needs the microphone open — Denis's click).

latency_budget_ms:              # acceptance criteria, not aspirations
  release_to_text_p50: 1200
  release_to_text_p95: 2500
  detect_heuristic_max: 15      # the always-on path; must not be felt
  enhance_total_max: 2500       # opt-in path only; budget above does not apply

injection:
  primary: "cgevent_unicode"    # CGEventKeyboardSetUnicodeString + CGEventPost — bypasses the keymap
                                # entirely, which is what makes diacritics and symbols survive.
                                # Needs Accessibility.
  fallback: "pasteboard_paste"  # NSPasteboard write + synthetic Cmd+V — ALSO needs Accessibility
  last_resort: "pasteboard_only" # no grant at all: set pasteboard + toast, Denis pastes.
                                # Never lose a prompt.
  fallback_trigger:             # when the primary path is skipped for pasteboard_paste
    over_chars: 600             # provisional (2026-09-19): transcripts longer than this paste
                                # instead of typing (600 chars = 30 chunks, ~150 ms of posting at
                                # the values below). Any exception from the CGEvent path also
                                # falls back; Accessibility missing or Secure Input on go straight
                                # to pasteboard_only. Not measured against a real target app yet.
  chunk_chars: 20               # provisional (2026-09-19): UTF-16 units per key event. 20 is the
                                # widely reported point past which apps truncate the string a
                                # single CGEvent carries (the event itself holds 100 — measured,
                                # CGEventKeyboardGetUnicodeString round-trip). NOT measured in a
                                # real target app yet: that needs Accessibility + a focused field.
  inter_chunk_delay_ms: 5       # provisional (2026-09-19): too fast and the target app drops
                                # characters. Unmeasured; the Phase 4 gate's byte-identical check
                                # in Terminal and the Claude Code TUI is what settles it.
  pasteboard_restore_delay_ms: 150
                                # provisional (2026-09-19): pasteboard_paste waits this long after
                                # Cmd+V before putting the previous pasteboard back. The target
                                # reads the pasteboard asynchronously; restoring sooner pastes the
                                # OLD contents. Unmeasured.
  restore_pasteboard: true
  secure_input_check: true      # if another app has Secure Input enabled, injection silently
                                # fails — detect it and fall back to pasteboard with a toast

paths:
  claude_projects_glob: "~/.claude/projects/*/*.jsonl"
                                # VERIFIED on disk 2026-09-15: 148 files, layout
                                # ~/.claude/projects/<encoded-cwd>/<session-uuid>.jsonl.
                                # The scanner anchors at the root and walks it recursively,
                                # so the documented subagent subdirectory would be picked up
                                # without a config change. See docs/verified-schemas.md §1.
  claude_settings: ".claude/settings.json"
                                # PROJECT scope, relative to this repo root. RESOLVED
                                # 2026-09-18 (U3): registering here means the hook fires
                                # only while Claude Code is running inside Dict8, which is
                                # where it can be observed and where a mistake costs one
                                # repo instead of every session on the machine. Going
                                # global (`~/.claude/settings.json`) is Denis's call, not
                                # the loop's — see docs/LOOP.md "Standing assumptions".
                                # READ BY CLAUDE CODE, NOT BY DICT8. No Dict8 code opens
                                # this file or this key: it is recorded here so the repo
                                # says where the hook is registered, and `.claude/
                                # settings.json` is the file Claude Code itself reads. Same
                                # for the per-hook `timeout: 5` inside it — it has no
                                # config key here because Dict8 cannot enforce it; it is
                                # Claude Code's own belt, in whole seconds (the only unit
                                # it takes), bounding what hooks.timeout_ms below cannot
                                # see: `uv`'s resolution and the interpreter start, ~45 ms
                                # of the whole-path measurement. 5 s is ~100x that, loose
                                # on purpose — a deadlock catcher, not a latency budget.
                                # The command registered there is wrapped so the SHELL can
                                # never return non-zero: exit 2 from a Claude Code hook
                                # BLOCKS the prompt, and `--project "$CLAUDE_PROJECT_DIR"`
                                # exits 2 on an empty or missing directory (measured),
                                # which would have blocked prompts before any Dict8 code
                                # ran at all.
  db: "~/Library/Application Support/Dict8/dict8.sqlite"
  logs: "~/Library/Logs/Dict8/"

hooks:
  user_prompt_submit: true      # the estimate's delivery slot — fires before Claude processes
  post_tool_use: true           # live-meter ticks
  session_end: true             # finalize the session row
  fail_open: true               # a hook error never blocks the user's prompt. NOT a
                                # switch the handlers obey downward: CLAUDE.md invariant 8
                                # is not a setting, so setting this false is recorded in
                                # hooks.log and ignored. It exists to be read, not to be
                                # able to turn a dictation tool into the reason a prompt
                                # did not send.
  timeout_ms: 250               # self-enforced budget for the in-process part of a hook:
                                # everything from the `dict8.hooks` import onward, which
                                # is config.yml, the payload read, the DB open, the
                                # estimate and the write-back.
                                # MEASURED 2026-09-18, four independent sets of 20 cold
                                # `uv run --quiet dict8 hook user-prompt-submit` runs piping
                                # the captured real payload (docs/verified-schemas.md 8)
                                # against a copy of the real store:
                                #   in-process  p50 4.9-7.2 ms  p95 4.9-7.5 ms  max 13.1 ms
                                #   whole path  p50 45.9-59.6 ms  p95 46.6-83.7 ms
                                # Read the whole-path figure as a RANGE, not a number: it
                                # VARIES RUN TO RUN with machine load, and it is dominated
                                # by `uv` resolving and python starting, neither of which is
                                # Dict8 working or inside this budget. IN-PROCESS 5-8 ms is
                                # the stable number and the one this key bounds.
                                # 250 is ~33x the worst in-process p95 seen. It is
                                # deliberately not tight: the growth term is load_turns at
                                # 0.0012 ms/turn (measured), so 10,000 turns of history
                                # would add ~12 ms — what would actually trip this is a
                                # locked WAL or a cold page cache, and those deserve the
                                # retry, not an instant refusal. (Measured: the watchdog
                                # fires at ~255 ms under a real BEGIN EXCLUSIVE lock.)
                                # The budget covers only what Dict8 controls; `uv`'s own
                                # resolution and the interpreter start happen before any
                                # Dict8 code runs. Claude Code's per-hook `timeout` in
                                # .claude/settings.json is the second belt that covers
                                # those, in whole seconds, which is why both exist.

usage_oracle:                   # cross-check tool — NOT a runtime dependency
  tool: "claude-tokens"         # https://pypi.org/project/claude-tokens/ — MIT, stdlib only
  version_pinned: "0.2.1"
  install: "uv tool install claude-tokens==0.2.1"
  tz_env: "Europe/Bucharest"    # its default is Asia/Shanghai — must be overridden or days misbucket
  config_path: "~/Library/Application Support/claude-tokens/pricing.toml"  # macOS location
  use: "Phase 1 reconciliation + periodic drift check. Never in the dictation path."
  ignore: "its USD cost columns — subscription, not API billing; our unit is quota %"

cli:                            # defaults for `dict8` subcommand flags. Every one of these
                                # was an argparse literal in dict8/cli.py until 2026-09-19
                                # (U4); the value here IS that previous default, moved, not
                                # re-chosen. A flag on the command line still overrides it.
                                # Only `reconcile_tolerance_pct` has an external source.
  tail_interval_s: 2.0          # `dict8 tail` poll interval. PREVIOUS HARDCODED DEFAULT
                                # (`--interval`). Unmeasured and loose on purpose: nothing
                                # in the latency budget runs through the tail, and
                                # transcripts flush at turn boundaries (HANDOFF section 4.9),
                                # so polling faster than a turn buys nothing. The Phase 1
                                # gate's "within 5 s" is the only bound that exists on it.
  reconcile_days: 7             # `dict8 reconcile` window, in settled days. PREVIOUS
                                # HARDCODED DEFAULT (`--days`). Kept short deliberately:
                                # both sides bucket days in a fixed offset derived from
                                # usage_oracle.tz_env, so a DST change inside the window
                                # would misbucket on the oracle's side.
  reconcile_tolerance_pct: 0.5  # max per-column and total percent delta for `dict8
                                # reconcile` to pass. PREVIOUS HARDCODED DEFAULT
                                # (`--tolerance`) — and the only one of the three with a
                                # source outside the code: prompts/build.md's Phase 1 gate
                                # says the two readers must "agree within 0.5%", and a
                                # larger gap is a parser bug rather than rounding.

detect:                         # is this dictation a prompt for Claude Code, or plain text?
  mode: "heuristic_gates_classifier_resolves"
  signals:                      # ordered by cost; the frontmost-app check is nearly free
    - frontmost_app_is_claude_code   # NSWorkspace frontmost bundle id + AX window title
    - transcript_length
    - imperative_opening
    - contains_identifier_or_path
    - addresses_an_agent
  uncertain_band: "TBD"         # heuristic scores inside this band escalate to the classifier
  shadow_log_both: true         # Phase 5 logs heuristic AND classifier verdict on every
                                # dictation, so the band can be tuned on real data
  max_escalation_rate: 0.25     # if more than this share escalates, the heuristic is too weak

enhance:
  default: "TBD"                # onboarding choice: auto | manual | off
  skip_buckets: ["quick-fix", "unknown"]
  accept_required_when: ["questions_nonempty", "uncertain_terms_nonempty"]
  model: "TBD"
  timeout_ms: 1500              # exceeded → inject the raw transcript, toast the timeout
  meter_as_line_item: true      # enhancement spends quota; it shows up in the meter

classifier:
  buckets: ["quick-fix", "feature-build", "architecture", "debug"]
  backend: "mlx-lm"             # DECIDED (Denis, 2026-09-15): local, not a cloud API call —
                                # detection can hand this text that was never meant for
                                # Claude Code at all, and invariant 7 is local-only.
  model: "mlx-community/Qwen2.5-3B-Instruct-4bit"
                                # MEASURED on this machine (Apple M5) against
                                # prompts/classify.evals.yml, 2026-09-19, after the prompt
                                # was cut down to the bucket alone (U4): 11/12 (gate is
                                # >=10/12), warm latency 320-388ms, median 334ms. The same
                                # gate immediately before that change: 11/12 at 605-713ms,
                                # median 636ms — so roughly half the budget came back, and
                                # with it the coverage: on a scratch copy of the real store
                                # the corpus went from 74/109 turns bucketed to 92/109, and
                                # the longest prompt that fits the budget went from 155
                                # words to 595. The one eval case that regressed ("use
                                # opus" — a voice command, expected "unknown", now
                                # "feature-build") is reproducible, not noise; see the
                                # dict8/advise/classifier.py docstring for the trade.
                                # The margin against timeout_ms below is no longer thin,
                                # but the client still enforces the timeout itself and
                                # kills+replaces its worker on overrun rather than trusting
                                # the model to stay under it.
  timeout_ms: 800               # exceeded => "no recommendation"; NEVER blocks the send
  on_error: "omit"
  max_output_tokens: 80         # generation cap for one classification. NOT measured —
                                # this is the literal that was hardcoded in
                                # dict8/advise/classifier.py as `generate(..., max_tokens=80)`
                                # until 2026-09-19 (U4), moved here unchanged per invariant 3.
                                # It is a ceiling, not a target: the model emits the bucket
                                # object and stops on EOS well before it. Raising it cannot
                                # make a call faster; lowering it below the object's length
                                # would truncate the JSON and the client would log an
                                # unparseable-output omit.
  load_timeout_ms: 30000        # how long the parent waits for the worker to report the
                                # model loaded before giving up and killing it. PREVIOUS
                                # HARDCODED DEFAULT (`_spawn(load_timeout_s=30.0)`), same
                                # value, expressed in ms like every other budget in this
                                # file. Not a latency budget — a cold load is 1.0-2.3 s
                                # measured (HANDOFF section 5); this is the "the child is
                                # wedged, stop waiting" catcher, ~13x the worst load seen.
  worker_join_timeout_ms: 1000  # how long `_kill()` waits for a terminated worker to
                                # actually exit before escalating SIGTERM -> SIGKILL, and
                                # again after the kill. PREVIOUS HARDCODED DEFAULT
                                # (`join(timeout=1.0)`, twice), unchanged.

models:                         # user-editable; recommender may ONLY name entries from here
                                # provisional (2026-09-19): docs/LOOP.md "Provisional defaults" —
                                # the models Denis's own transcripts used, read off a scratch copy
                                # of the store (`select model, count(*) from turns group by model`):
                                # claude-opus-5 61 turns, claude-sonnet-5 30, claude-fable-5-1 21,
                                # claude-haiku-4-5-20251001 5 (plus 2 `<synthetic>` + 1 null, not
                                # models). `buckets:` is the whole bucket -> model mapping
                                # (dict8/advise/recommend.py): a bucket no entry lists — today only
                                # `unknown` — gets no recommendation, never a guess. A bucket listed
                                # by two entries is a config error the recommender refuses.
                                # Strength lines are capability only: no USD (invariant 6), and no
                                # quota weighting, because nothing measured one yet.
  - id: "claude-sonnet-5"       # provisional (2026-09-19): 30 turns in the store
    label: "Sonnet 5"
    strength_line: "quick and light — small, well-scoped edits"
    buckets: ["quick-fix"]      # provisional (2026-09-19): LOOP.md mapping
  - id: "claude-opus-5"         # provisional (2026-09-19): 61 turns, Denis's most-used model
    label: "Opus 5"
    strength_line: "strong all-round coder — debugging and multi-file features"
    buckets: ["debug", "feature-build"]   # provisional (2026-09-19): LOOP.md mapping
  - id: "claude-fable-5-1"      # provisional (2026-09-19): 21 turns in the store
    label: "Fable 5.1"
    strength_line: "deepest reasoning — design and long-horizon work"
    buckets: ["architecture"]   # provisional (2026-09-19): LOOP.md mapping
  - id: "claude-haiku-4-5-20251001"   # provisional (2026-09-19): 5 turns in the store
    label: "Haiku 4.5"
    strength_line: "fastest — simple, mechanical tasks"
    buckets: []                 # provisional (2026-09-19): recommended for no bucket; present
                                # so a spoken "use haiku" override names a model Denis has

quota:
  source: "manual"              # no public API — user types weekly % after /usage
  checkin_cadence: "TBD"
  last_reading: null
  stale_after_hours: "TBD"      # past this, show staleness instead of a burn-rate warning
  min_rate_span_hours: 0.05     # two check-ins closer together than this are too close to
                                # divide by: no burn rate, and the reason is printed.
                                # PREVIOUS HARDCODED DEFAULT, expressed as a number instead
                                # of as a formatting side effect — the guard in
                                # dict8/hooks/user_prompt_submit.py was
                                # `f"{span_h:.1f}" == "0.0"`, i.e. exactly "span < 0.05 h"
                                # (3 minutes), tied to the precision the line happens to
                                # print at. Same behaviour, now a number a reader can see
                                # and Denis can change. NOT measured: no pair of real
                                # readings exists yet (quota_readings is empty).

estimate:
  # Every number in this block is from ONE run: `uv run dict8 estimate --eval`,
  # 2026-09-18, n=92 usable turns, leave-one-out. The DB grows while you work — the
  # session you run in writes the transcripts the parser reads (HANDOFF §9) — so re-running
  # --eval will not reproduce these digits exactly. The orderings and the plateaus are what
  # is stable; the third significant figure is not. Re-run --eval before quoting any of it.
  method: "quantile"            # bucket median + quantile band. Was "heuristic" through
                                # Phase 0-1; `dict8.advise.estimator.METHODS` still accepts
                                # that spelling so an older config keeps working, but the
                                # name here is now the one the code and the reports print.
                                # MEASURED, 25/75 band, n=92:
                                #   quantile    MAPE 174.6%  MdAPE 73.8%  coverage 0.477  band 6.9x
                                #   regression  MAPE 132.2%  MdAPE 67.6%  coverage 0.477  band 4.1x
                                # Both refused the same 6 of 92 held-out turns, so the two
                                # rows compare like for like.
                                # THE REGRESSION WINS HELD-OUT: same coverage, but 42 points
                                # less MAPE and a band 1.7x tighter for it. (Read that edge as
                                # an upper bound — its band comes from in-sample residuals,
                                # which flatters its coverage. See the estimator docstring.)
                                # It is NOT shipped: n=92 is under min_samples_for_regression
                                # below, and that floor is not negotiable on a score measured
                                # on 92 points with 10-28 per bucket.
                                # dict8.advise.estimator.select_method enforces it, so setting
                                # method: "regression" today is refused with that message
                                # rather than quietly shipping an unsupported fit — `dict8
                                # estimate --eval` still prints its full table under such a
                                # config, it just reports that nothing would ship.
                                # Revisit when the backfill passes 200 turns: if the regression
                                # still wins, switch this value to "regression" and re-run --eval.
  output: "range"               # never a point estimate
  min_samples_for_regression: 200
  refuse_when_out_of_distribution: true
                                # false does NOT silence the check: the range still comes back
                                # flagged ood with the reason attached, drawn from the pooled
                                # distribution and labeled an extrapolation. It buys
                                # EXTRAPOLATION, never FABRICATION — the two sample floors
                                # below still hold, because no flag can conjure a band out of
                                # a sample too small to have one.
  interval_low_q: 0.25          # the central 50% band. MEASURED (band sweep, same run): of the
  interval_high_q: 0.75         # three candidates this is both the best-calibrated and the only
                                # usable width —
                                #   25/75 : nominal 50%, held-out 0.477 (gap 2.3 pts), band 6.9x
                                #   10/90 : nominal 80%, held-out 0.721 (gap 7.9 pts), band 47.1x
                                #    5/95 : nominal 90%, held-out 0.849 (gap 5.1 pts), band 185.7x
                                # A band 47x wide ("200K to 9M tokens") answers nothing, and the
                                # wider bands also overstate their own coverage by more. The cost
                                # is honest and stated in the output: half of real turns land
                                # outside a 50% band.
  min_samples_for_bucket: 10    # at/above this a bucket uses its own band; below it, the pooled
                                # distribution over all turns. MEASURED (pooling sweep, same run;
                                # only this knob moves, the refusal floor is pinned at 1):
                                # floors 1-8 -> MdAPE 74.0 / coverage 0.459; floors 10-12 ->
                                # 73.8 / 0.477; 15-20 -> 79.8 / 0.500; 29 (pool everything) ->
                                # 85.2 / 0.484. 10 is the low end of the best plateau. Honest
                                # reading: 1 vs 10 is noise (0.2 MdAPE points); what the sweep
                                # really shows is that pooling EVERYTHING is clearly worse, i.e.
                                # the buckets carry some signal. Today only feature-build (n=10)
                                # sits near the line.
  ood_min_bucket_samples: 5     # below this many past turns in the named bucket, no range at all.
                                # DERIVED from the band above, not picked: a 25/75 band over n
                                # points puts its low edge at index 0.25*(n-1), so for n<5 that
                                # edge IS the bucket minimum and the "50% band" is really the
                                # observed range wearing a quantile's name.
                                # The refusal sweep in --eval (which moves ONLY this knob) shows
                                # the data cannot distinguish any floor from 1 to 8 — all give
                                # 86 scored / 6 refused, MdAPE 73.8, coverage 0.477 — because
                                # bucket counts today are architecture=0, feature-build=10,
                                # quick-fix=15, debug=15, unknown=28 and nothing lands between
                                # 1 and 9. Re-measure if a bucket ever does.
  ood_min_pooled_samples: 5     # the same floor on the POOLED group — every recorded turn,
                                # whatever its bucket. This is the path that matters most: the
                                # UserPromptSubmit hook has no bucket to pass (there is no model
                                # call at submit time), so almost every real estimate is drawn
                                # from the pooled group, and it was the ONE group with no floor
                                # on it. A store holding a single turn answered
                                # "1,000 - 1,000 tokens (median 1,000), central 50% band" —
                                # a point estimate wearing a band's label, which estimate.output
                                # above forbids. Caught in U2 verification, 2026-09-18.
                                # DERIVED, same arithmetic as ood_min_bucket_samples: with a
                                # 25/75 band the low edge sits at index 0.25*(n-1), so below n=5
                                # both edges collapse onto the smallest and largest turn on
                                # record. NOT measurable by leave-one-out: the pooled group is
                                # always the whole store minus one, far above any floor worth
                                # arguing about. The "pooled band vs n" table in --eval is the
                                # only evidence there is, and it is honest about what this floor
                                # does and does not buy: hi/lo runs 1.0x at n=1 (a literal point),
                                # 1.9x at n=3, 2.9x at n=5, and only settles near 6.5-6.9x past
                                # n=60. So 5 stops the degenerate case; it does NOT make a band
                                # off 5 turns trustworthy, and a fresh install's first estimates
                                # will be far too narrow. Raise it if that lands badly in use.

voice_commands:                 # dict8/advise/voice.py. Matched post-transcription on WHOLE
                                # SENTENCES, never on a prefix: "exact-prefix" (the seeded rule)
                                # would have fired `send` on "send the email to Ana". A sentence
                                # ends at . ! ? or a newline; matching lowercases it and turns every
                                # run of non-alphanumerics into one space, so Whisper's "Send." and
                                # "send!" match while "use opus-style naming" does not match "use
                                # opus". Anything not matched is injected verbatim. A strip is
                                # logged as the command name only, never the text.
  send: ["send"]                # FINAL standalone sentence only ("... Send."). Stripped; the rest
                                # is injected, then one Return is posted to submit. Never posted
                                # when the text only reached the clipboard.
  cancel: ["cancel", "scratch that"]
                                # the WHOLE utterance or its FINAL sentence. The dictation is
                                # discarded, nothing injected (menu › Copy last transcript still
                                # has it, in memory only).
  override_model:               # LEADING standalone sentence only. Stripped, shown on the overlay
                                # as the override and recorded; each value must be a models[].id.
                                # provisional (2026-09-19): the three spoken names map to the
                                # models[] entries of the same family.
    "use opus": "claude-opus-5"
    "use sonnet": "claude-sonnet-5"
    "use haiku": "claude-haiku-4-5-20251001"
  override_types_slash_command: false
                                # provisional (2026-09-19): true would also type `/model <id>` +
                                # Return into the target app before the text. OFF: it posts keys
                                # into Claude Code that Denis did not dictate, and a wrong target
                                # app would receive them — his call, not the loop's.

overlay:                        # dict8/ui/overlay.py — the non-activating panel shown on release
  dismiss_after_s: 5            # provisional (2026-09-19): long enough to read the chip and the
                                # range once they land (~0.4-0.8 s after release, measured in U6),
                                # short enough to be gone before the next dictation. Unmeasured
                                # against Denis's reading; the panel never takes focus or clicks,
                                # so erring long costs screen space, not input.

window:                         # dict8/ui/window.py — the Dict8 window (Denis, 2026-09-19: "I'd like
                                # to see the UI"). Status, permissions with the buttons that fix
                                # them, models, last dictation, meter, and a box to dictate into.
  show_at_launch: true          # provisional (2026-09-19): open it when `dict8 app` starts; the
                                # menu's "Open Dict8 window" reopens it after it is closed.
  preview_text: "Fix the failing test in the transcript parser and explain what caused it."
                                # provisional (2026-09-19): what "Preview overlay" runs through the
                                # real classifier + estimator so the overlay can be seen without
                                # the microphone. Nothing is typed and no meter row is opened; its
                                # latency row says `source: preview`, which bench_latency skips.

meter:                          # the live meter in `dict8 app` (polls with cli.tail_interval_s)
  turn_idle_s: 900              # provisional (2026-09-19): a dictation's estimate-vs-actual row is
                                # closed when the next dictation starts, or after this long with no
                                # new tokens in its session. MEASURED on a scratch copy of the
                                # store, 119 turns: the longest gap between two assistant messages
                                # inside one turn is p50 40 s, p90 207 s, p95 362 s, p99 859 s, max
                                # 996 s. 900 s sits above p99, so an idle close truncates roughly
                                # 1 turn in 100; shorter would under-report long agentic turns.

privacy:
  audio_leaves_machine: false   # LOCKED
  telemetry: false              # LOCKED
  store_transcripts: "features_only"
                                # DECIDED (Denis, 2026-09-15): derived features only — length,
                                # word count, files touched, bucket, model, tokens, wall time.
                                # Raw prompt text is NEVER written to the DB. The estimator's
                                # feature list needs no text, so this costs it nothing.
  transcript_retention: null    # n/a while store_transcripts is features_only
