# config.yml — Dict8
# The ONLY source of truth for paths, keys, models, thresholds.
# RULE: null / "TBD" is never invented, never defaulted. Code reads config;
# code does not hardcode. A visible gap beats a plausible guess.

meta:
  app: "Dict8"
  version: "v1-mvp"
  platform: "macos"             # LOCKED — re-targeted from windows, see docs/ADR-000-platform.md
  arch: "apple-silicon"         # LOCKED — no CUDA path exists; see ADR-000
  target_tool: "claude-code"    # LOCKED — any other AI tool is out of scope

hardware:                       # all four: read off the real box, never assumed
  chip: "TBD"                   # sysctl -n machdep.cpu.brand_string
  unified_memory_gb: "TBD"      # bounds the largest model that can stay warm in memory
  macos_version: "TBD"          # sw_vers -productVersion
  mic_device: "TBD"             # exact device name; never assume "default"

permissions:                    # macOS-only. No Windows equivalent — see ADR-000.
  accessibility: "required"     # CGEventPost (inject) AND CGEventTap (hotkey) — one grant covers both
  input_monitoring: "TBD"       # VERIFY in Phase 1 whether the tap also trips this separate grant
  microphone: "required"
  recheck_on: "every_dictation" # grant is revocable at runtime; never cached as "granted once"

packaging:
  bundle_id: "TBD"              # TCC grants attach to the signed bundle identity — must be stable
  signing: "TBD"                # ad-hoc vs Developer ID; re-signing can reset the Accessibility grant
  launch_at_login: "TBD"

hotkey:
  push_to_talk: "TBD"           # hold-to-talk; must not collide with terminal/IDE bindings
  cancel: "TBD"                 # abort without injecting
  mechanism: "TBD"              # cgeventtap | carbon_hotkey — decide in Phase 1
                                # carbon_hotkey cannot bind a bare modifier (fn/right-opt); tap can

stt:
  backend: "TBD"                # mlx-whisper | whispercpp-metal | faster-whisper-cpu — from benchmark
                                # NOT defaulted: CTranslate2 has no Metal backend, so the seeded
                                # "faster-whisper unless beaten" default pre-judged the benchmark
  model: "TBD"                  # from benchmark — see stt.candidates
  compute: "TBD"                # metal | ane | cpu — follows the winning backend
  quantization: "TBD"           # backend-specific (q5_0, 4bit, int8, fp16) — from benchmark
  language: "en"                # DECIDED: English-only for v1 MVP. Keeps all three candidates
                                # eligible and drops the language-detection pass from the hot path.
  vad: true
  candidates:                   # the Phase 0 benchmark matrix; bench reads this, nothing hardcoded
    backends: ["mlx-whisper", "whispercpp-metal", "faster-whisper-cpu"]
    models: ["small.en", "medium.en", "large-v3-turbo"]
                                # RESOLVED: language is "en", so the English-only models stay
                                # eligible and all three candidates race. Adding a non-English
                                # language later disqualifies small.en/medium.en — see ADR-000.

latency_budget_ms:              # acceptance criteria, not aspirations
  release_to_text_p50: 1200
  release_to_text_p95: 2500

injection:
  primary: "cgevent_unicode"    # CGEventKeyboardSetUnicodeString + CGEventPost — needs Accessibility
  fallback: "clipboard_paste"   # set pasteboard + synthesize Cmd+V — ALSO needs Accessibility
  last_resort: "clipboard_only" # no grant at all: set pasteboard + toast, Denis pastes. Never lose a prompt.
  fallback_trigger: "TBD"       # char count and/or measured failure — decide in Phase 1
  chunk_chars: "TBD"            # MEASURE: CGEventKeyboardSetUnicodeString drops/mangles long strings;
                                # chunking is required, safe chunk size is a Phase 1 measurement
  inter_chunk_delay_ms: "TBD"   # MEASURE: too fast and the target app drops characters
  restore_clipboard: true

paths:
  claude_projects_glob: "TBD"   # VERIFY on disk in Phase 2. Reference layout:
                                # ~/.claude/projects/<encoded-cwd>/<session-uuid>.jsonl
  claude_settings: "TBD"        # which settings file the hooks get registered in
  db: "~/Library/Application Support/Dict8/dict8.sqlite"
  logs: "~/Library/Logs/Dict8/"

usage_oracle:                   # cross-check tool — NOT a runtime dependency
  tool: "claude-tokens"         # https://pypi.org/project/claude-tokens/ — MIT, stdlib only
  version_pinned: "0.2.1"
  install: "uv tool install claude-tokens==0.2.1"
  tz_env: "Europe/Bucharest"    # its default is Asia/Shanghai — must be overridden or days misbucket
  use: "Phase 2 reconciliation + periodic drift check. Never in the dictation path."
  ignore: "its USD cost columns — Denis is on a subscription; the unit here is quota %, not dollars"

models:                         # user-editable; recommender may ONLY name entries from here
  - { id: "TBD", label: "TBD", strength_line: "TBD" }

classifier:
  buckets: ["quick-fix", "feature-build", "architecture", "debug"]
  model: "TBD"                  # exact model string for the one cheap call
  timeout_ms: 800               # exceeded => "no recommendation"; NEVER blocks the send
  on_error: "omit"

quota:
  source: "manual"              # no public API — user types weekly % after /usage
  checkin_cadence: "TBD"
  last_reading: null
  stale_after_hours: "TBD"      # past this, show staleness instead of a burn-rate warning

estimate:
  method: "heuristic"           # until backfill + fit beats it on held-out data
  output: "range"               # never a point estimate
  min_samples_for_regression: 200
  refuse_when_out_of_distribution: true

voice_commands:                 # matched post-transcription, exact-prefix, case-insensitive
  send: ["send"]
  override_model: ["use opus", "use sonnet", "use haiku"]
  cancel: ["cancel", "scratch that"]

privacy:
  audio_leaves_machine: false   # LOCKED
  telemetry: false              # LOCKED
  store_transcripts: "TBD"      # yes/no + retention — changes the SQLite schema
